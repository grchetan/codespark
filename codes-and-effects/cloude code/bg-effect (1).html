<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Page - BG Effect</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #050508;
    --accent1: #7c3aed;
    --accent2: #06b6d4;
    --accent3: #f59e0b;
    --text: #f1f5f9;
    --muted: #64748b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ── Canvas BG ── */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Radial glow blobs ── */
  .glow-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
    animation: floatBlob linear infinite;
  }
  .blob1 { width: 600px; height: 600px; background: var(--accent1); top: -100px; left: -150px; animation-duration: 22s; }
  .blob2 { width: 500px; height: 500px; background: var(--accent2); bottom: -80px; right: -100px; animation-duration: 28s; animation-direction: reverse; }
  .blob3 { width: 350px; height: 350px; background: var(--accent3); top: 40%; left: 50%; animation-duration: 18s; }

  @keyframes floatBlob {
    0%   { transform: translate(0,0) scale(1); }
    33%  { transform: translate(40px,-30px) scale(1.08); }
    66%  { transform: translate(-30px,40px) scale(0.95); }
    100% { transform: translate(0,0) scale(1); }
  }

  /* ── Noise grain overlay ── */
  .grain {
    position: fixed;
    inset: -200%;
    width: 400%;
    height: 400%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.035;
    pointer-events: none;
    z-index: 1;
    animation: grainShift 0.15s steps(1) infinite;
  }
  @keyframes grainShift {
    0%   { transform: translate(0,0); }
    20%  { transform: translate(-3%,-4%); }
    40%  { transform: translate(3%,2%); }
    60%  { transform: translate(-2%,5%); }
    80%  { transform: translate(4%,-2%); }
    100% { transform: translate(0,0); }
  }

  /* ── Grid lines ── */
  .grid-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
  }

  /* ── Page content ── */
  .page {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(124,58,237,0.4);
    background: rgba(124,58,237,0.1);
    color: #a78bfa;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 5px 14px;
    border-radius: 999px;
    margin-bottom: 2rem;
    backdrop-filter: blur(8px);
    animation: fadeUp 0.8s ease both;
  }
  .badge::before { content:''; width:6px; height:6px; border-radius:50%; background:#a78bfa; animation: pulse 1.5s ease infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 10vw, 8rem);
    line-height: 0.92;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #f1f5f9 0%, #94a3b8 60%, #7c3aed 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeUp 0.8s 0.15s ease both;
    max-width: 900px;
  }

  p.sub {
    margin-top: 1.5rem;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: var(--muted);
    max-width: 520px;
    line-height: 1.7;
    font-weight: 300;
    animation: fadeUp 0.8s 0.3s ease both;
  }

  .cta-group {
    margin-top: 2.5rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeUp 0.8s 0.45s ease both;
  }

  .btn {
    padding: 0.85rem 2rem;
    border-radius: 6px;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s;
    text-decoration: none;
    display: inline-block;
    letter-spacing: 0.02em;
  }
  .btn-primary {
    background: var(--accent1);
    color: #fff;
    border: none;
    box-shadow: 0 0 30px rgba(124,58,237,0.4);
  }
  .btn-primary:hover { background: #6d28d9; box-shadow: 0 0 50px rgba(124,58,237,0.7); transform: translateY(-2px); }
  .btn-ghost {
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
  }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.35); transform: translateY(-2px); }

  @keyframes fadeUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
  }

  /* ── Floating particles info ── */
  .info {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.7rem;
    color: rgba(100,116,139,0.5);
    letter-spacing: 0.1em;
    z-index: 20;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- BG Layers -->
<canvas id="bg-canvas"></canvas>
<div class="grain"></div>
<div class="glow-blob blob1"></div>
<div class="glow-blob blob2"></div>
<div class="glow-blob blob3"></div>
<div class="grid-overlay"></div>

<!-- Content -->
<div class="page">
  <span class="badge">✦ New Experience</span>
  <h1>BUILD THE<br>FUTURE TODAY</h1>
  <p class="sub">Yahan apna catchy tagline likhein. Ye background effect aapki website ke home page par use kar sakte hain.</p>
  <div class="cta-group">
    <a href="#" class="btn btn-primary">Get Started →</a>
    <a href="#" class="btn btn-ghost">Learn More</a>
  </div>
</div>

<div class="info">Scroll to explore</div>

<script>
// ── Particle / Aurora canvas ──
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [], mouse = { x: -999, y: -999 };

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); init(); });
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

// Particle class
class Particle {
  constructor() { this.reset(true); }
  reset(init = false) {
    this.x  = Math.random() * W;
    this.y  = init ? Math.random() * H : H + 10;
    this.r  = Math.random() * 1.5 + 0.3;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = -(Math.random() * 0.6 + 0.2);
    this.alpha = 0;
    this.maxAlpha = Math.random() * 0.6 + 0.1;
    this.life  = 0;
    this.maxLife = Math.random() * 300 + 150;
    const hues = [265, 190, 40];
    this.hue = hues[Math.floor(Math.random() * hues.length)];
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life++;
    // mouse repel
    const dx = this.x - mouse.x, dy = this.y - mouse.y;
    const dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < 100) {
      this.x += dx / dist * 1.5;
      this.y += dy / dist * 1.5;
    }
    if (this.life < 40) this.alpha = (this.life/40) * this.maxAlpha;
    else if (this.life > this.maxLife - 40) this.alpha = ((this.maxLife-this.life)/40) * this.maxAlpha;
    if (this.life >= this.maxLife || this.y < -10) this.reset();
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${this.hue},80%,75%,${this.alpha})`;
    ctx.fill();
  }
}

function init() {
  particles = Array.from({ length: 160 }, () => new Particle());
}

// Aurora lines
function drawAurora(t) {
  const count = 5;
  for (let i = 0; i < count; i++) {
    const phase = (t * 0.0003 + i * 0.7);
    const y0 = H * 0.5 + Math.sin(phase) * H * 0.25;
    const grad = ctx.createLinearGradient(0, y0 - 60, 0, y0 + 60);
    const hue = (265 + i * 30 + t * 0.01) % 360;
    grad.addColorStop(0, `hsla(${hue},70%,55%,0)`);
    grad.addColorStop(0.5, `hsla(${hue},70%,55%,0.04)`);
    grad.addColorStop(1, `hsla(${hue},70%,55%,0)`);

    ctx.beginPath();
    ctx.moveTo(0, y0);
    for (let x = 0; x <= W; x += 8) {
      const y = y0 + Math.sin(x * 0.006 + phase + i) * 40
                   + Math.sin(x * 0.003 + phase * 1.3) * 25;
      ctx.lineTo(x, y);
    }
    ctx.lineWidth = 80;
    ctx.strokeStyle = grad;
    ctx.stroke();
  }
}

let t = 0;
function loop() {
  requestAnimationFrame(loop);
  ctx.clearRect(0, 0, W, H);
  t++;
  drawAurora(t);
  particles.forEach(p => { p.update(); p.draw(); });
}

init();
loop();
</script>
</body>
</html>
