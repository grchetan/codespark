
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{cursor:none;}
.scene{
  width:100%;min-height:520px;background:#05050f;
  border-radius:16px;overflow:hidden;position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Segoe UI',sans-serif;
}
canvas#fx{position:absolute;inset:0;pointer-events:none;}
.ui{position:relative;z-index:2;text-align:center;pointer-events:none;}
.big{
  font-size:clamp(52px,11vw,110px);font-weight:900;
  letter-spacing:-.03em;line-height:1;
  background:linear-gradient(135deg,#fff 30%,rgba(255,255,255,.3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:.5rem;
}
.small{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.2);}
.mode-pills{
  display:flex;gap:8px;margin-top:2rem;flex-wrap:wrap;justify-content:center;pointer-events:all;
}
.pill{
  padding:6px 16px;border-radius:999px;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;cursor:none;border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.4);background:transparent;
  transition:all .25s;font-family:inherit;
}
.pill.active{border-color:rgba(255,255,255,.5);color:#fff;background:rgba(255,255,255,.07);}
</style>

<div class="scene" id="scene">
  <canvas id="fx"></canvas>
  <div class="ui">
    <div class="big">MOVE ME</div>
    <div class="small">cursor playground</div>
    <div class="mode-pills">
      <button class="pill active" data-mode="0">Comet</button>
      <button class="pill" data-mode="1">Magnet</button>
      <button class="pill" data-mode="2">Fire</button>
      <button class="pill" data-mode="3">Matrix</button>
      <button class="pill" data-mode="4">Ripple</button>
      <button class="pill" data-mode="5">Galaxy</button>
    </div>
  </div>
</div>

<script>
const scene = document.getElementById('scene');
const canvas = document.getElementById('fx');
const ctx = canvas.getContext('2d');

let W, H, mx = -999, my = -999, pmx = -999, pmy = -999;
let mode = 0, frame = 0;
let particles = [], ripples = [], matrixCols = [], magnetDots = [];

function resize(){
  const r = scene.getBoundingClientRect();
  W = canvas.width = r.width;
  H = canvas.height = r.height;
  initMode();
}

scene.addEventListener('mousemove', e => {
  const r = scene.getBoundingClientRect();
  pmx = mx; pmy = my;
  mx = e.clientX - r.left;
  my = e.clientY - r.top;
});
scene.addEventListener('click', e => {
  const r = scene.getBoundingClientRect();
  const cx = e.clientX - r.left, cy = e.clientY - r.top;
  if(mode === 4) ripples.push({x:cx,y:cy,r:0,life:1});
  if(mode === 0 || mode === 2 || mode === 5){
    for(let i=0;i<18;i++) spawnBurst(cx,cy);
  }
});

document.querySelectorAll('.pill').forEach(p=>{
  p.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active');
    mode = +p.dataset.mode;
    particles=[];ripples=[];
    initMode();
  });
});

const PALETTES = [
  ['#ffffff','#a0a8ff','#6070ff','#304cff'],
  ['#ff4ecb','#c044ff','#6644ff','#44b4ff'],
  ['#ff2200','#ff7700','#ffcc00','#ffff00'],
  ['#00ff41','#00cc33','#009922','#006611'],
  ['#00e5ff','#0088ff','#4400ff','#ff00cc'],
  ['#ffe066','#ff6ec7','#b388ff','#64ffda'],
];

function getPal(){ return PALETTES[mode]; }

function spawnBurst(x, y){
  const pal = getPal();
  const a = Math.random()*Math.PI*2;
  const s = 2+Math.random()*6;
  particles.push({
    x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,
    life:1,decay:.018+Math.random()*.022,
    r:2+Math.random()*4,
    color:pal[Math.floor(Math.random()*pal.length)],
    type:'burst'
  });
}

function spawnTrail(x,y){
  const pal = getPal();
  const spread = mode===2?8:3;
  particles.push({
    x:x+(Math.random()-.5)*spread,
    y:y+(Math.random()-.5)*spread,
    vx:(Math.random()-.5)*(mode===2?.8:.3),
    vy:mode===2?-(Math.random()*1.5+.5):(Math.random()-.5)*.3,
    life:1,
    decay: mode===2?.014+Math.random()*.018 : .025+Math.random()*.03,
    r: mode===2?3+Math.random()*5:1.5+Math.random()*3.5,
    color:pal[Math.floor(Math.random()*pal.length)],
    type:'trail'
  });
}

function initMode(){
  if(mode===3){
    const cols = Math.floor(W/14);
    matrixCols = Array.from({length:cols},(_,i)=>({
      x:i*14+7, y:Math.random()*H, speed:.8+Math.random()*2.5, chars:[]
    }));
  }
  if(mode===1){
    magnetDots=[];
    for(let i=0;i<60;i++){
      magnetDots.push({
        x:Math.random()*W, y:Math.random()*H,
        ox:0,oy:0, vx:0,vy:0,
        r:1.5+Math.random()*2,
        color:getPal()[Math.floor(Math.random()*getPal().length)]
      });
    }
    magnetDots.forEach(d=>{d.ox=d.x;d.oy=d.y;});
  }
}

const MCHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%';
function rndChar(){ return MCHARS[Math.floor(Math.random()*MCHARS.length)]; }

function drawCursor(){
  if(mx<0||mx>W||my<0||my>H) return;
  const pal = getPal();
  const t = frame*.04;

  ctx.save();
  ctx.beginPath();
  ctx.arc(mx,my,5,0,Math.PI*2);
  ctx.fillStyle='#fff';
  ctx.fill();

  for(let i=0;i<3;i++){
    const angle = t + (i/3)*Math.PI*2;
    const orbitR = 14+i*6;
    const dotR = 2.5-i*.4;
    const ox = mx+Math.cos(angle)*orbitR;
    const oy = my+Math.sin(angle)*orbitR;
    ctx.beginPath();
    ctx.arc(ox,oy,dotR,0,Math.PI*2);
    ctx.fillStyle=pal[i%pal.length];
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(mx,my,24,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.12)';
  ctx.lineWidth=1;
  ctx.stroke();

  ctx.restore();
}

function modeComet(){
  if(frame%2===0 && mx>0 && mx<W){
    for(let i=0;i<4;i++) spawnTrail(mx,my);
  }
  particles=particles.filter(p=>p.life>.01);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    p.vx*=.96;p.vy*=.96;
    p.life-=p.decay;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    ctx.fillStyle=p.color+hex(p.life*.9);
    ctx.fill();
  });
}

function modeMagnet(){
  magnetDots.forEach(d=>{
    const dx=mx-d.x, dy=my-d.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const maxD=130;
    if(dist<maxD){
      const f=(1-dist/maxD)*2.2;
      d.vx+=dx/dist*f;
      d.vy+=dy/dist*f;
    }
    const rdx=d.ox-d.x, rdy=d.oy-d.y;
    d.vx+=rdx*.04; d.vy+=rdy*.04;
    d.vx*=.88; d.vy*=.88;
    d.x+=d.vx; d.y+=d.vy;

    const speed=Math.sqrt(d.vx*d.vx+d.vy*d.vy);
    const alpha=Math.min(1,.2+speed*.25);
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.r+speed*.3,0,Math.PI*2);
    ctx.fillStyle=d.color+hex(alpha);
    ctx.fill();

    if(speed>.5){
      ctx.beginPath();
      ctx.moveTo(d.x,d.y);
      ctx.lineTo(d.x-d.vx*3,d.y-d.vy*3);
      ctx.strokeStyle=d.color+hex(alpha*.5);
      ctx.lineWidth=d.r*.8;
      ctx.stroke();
    }
  });
}

function modeFire(){
  if(mx>0&&mx<W){
    for(let i=0;i<6;i++) spawnTrail(mx,my);
  }
  particles=particles.filter(p=>p.life>.01);
  particles.forEach(p=>{
    p.x+=p.vx+(Math.random()-.5)*.5;
    p.y+=p.vy;
    p.vy-=.02;
    p.life-=p.decay;
    const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*p.life*1.5);
    g.addColorStop(0,p.color+hex(p.life));
    g.addColorStop(1,p.color+'00');
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*p.life*1.5,0,Math.PI*2);
    ctx.fillStyle=g;
    ctx.fill();
  });
}

function modeMatrix(){
  ctx.fillStyle='rgba(5,5,15,0.18)';
  ctx.fillRect(0,0,W,H);
  matrixCols.forEach(col=>{
    col.y+=col.speed;
    if(col.y>H+20) col.y=-20;
    const distX=Math.abs(mx-col.x);
    const distY=Math.abs(my-col.y);
    const near=distX<60&&distY<80;
    ctx.font='12px monospace';
    ctx.fillStyle=near?'#fff':'#00ff41';
    ctx.globalAlpha=near?1:.5+Math.random()*.3;
    ctx.fillText(rndChar(),col.x-5,col.y);
    ctx.globalAlpha=1;
    ctx.fillStyle='rgba(0,255,65,.3)';
    ctx.fillText(rndChar(),col.x-5,col.y-16);
  });
}

function modeRipple(){
  ripples=ripples.filter(r=>r.life>.01);
  if(frame%6===0 && mx>0&&mx<W){
    ripples.push({x:mx,y:my,r:0,life:.7,auto:true});
  }
  const pal=getPal();
  ripples.forEach(r=>{
    r.r+=3+r.r*.04;
    r.life-=r.auto?.012:.018;
    pal.forEach((c,i)=>{
      const off=i*12;
      ctx.beginPath();
      ctx.arc(r.x,r.y,Math.max(0,r.r-off),0,Math.PI*2);
      ctx.strokeStyle=c+hex(r.life*(1-i*.22));
      ctx.lineWidth=2-i*.3;
      ctx.stroke();
    });
  });
}

function modeGalaxy(){
  if(frame%2===0 && mx>0&&mx<W){
    const pal=getPal();
    for(let i=0;i<3;i++){
      const angle=frame*.12+i*(Math.PI*2/3);
      const spinR=12;
      const sx=mx+Math.cos(angle)*spinR;
      const sy=my+Math.sin(angle)*spinR;
      particles.push({
        x:sx,y:sy,
        vx:Math.cos(angle+Math.PI/2)*.6+(Math.random()-.5),
        vy:Math.sin(angle+Math.PI/2)*.6+(Math.random()-.5)-.5,
        life:1,decay:.012+Math.random()*.01,
        r:1.5+Math.random()*3,
        color:pal[i%pal.length],type:'galaxy',
        spin:Math.random()*Math.PI*2
      });
    }
  }
  particles=particles.filter(p=>p.life>.01);
  particles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    p.vx*=.98;p.vy*=.98;
    p.life-=p.decay;
    p.spin+=.08;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.spin);
    ctx.beginPath();
    ctx.moveTo(-p.r*p.life,0);
    ctx.lineTo(p.r*p.life,0);
    ctx.strokeStyle=p.color+hex(p.life);
    ctx.lineWidth=p.r*p.life*.8;
    ctx.lineCap='round';
    ctx.stroke();
    ctx.restore();
  });
}

function hex(a){ return Math.floor(Math.max(0,Math.min(1,a))*255).toString(16).padStart(2,'0'); }

function loop(){
  requestAnimationFrame(loop);
  frame++;

  if(mode!==3&&mode!==4){
    ctx.fillStyle='rgba(5,5,15,0.22)';
    ctx.fillRect(0,0,W,H);
  } else if(mode===4){
    ctx.fillStyle='rgba(5,5,15,0.12)';
    ctx.fillRect(0,0,W,H);
  }

  if(mode===0) modeComet();
  else if(mode===1) modeMagnet();
  else if(mode===2) modeFire();
  else if(mode===3) modeMatrix();
  else if(mode===4) modeRipple();
  else if(mode===5) modeGalaxy();

  drawCursor();
}

window.addEventListener('resize', resize);
resize();
loop();
</script>
