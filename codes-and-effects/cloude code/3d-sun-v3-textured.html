<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Realistic Sun (Textured)</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #000000; height: 100%; width: 100%;
  }
  #sun-container { width: 100vw; height: 100vh; position: relative; }
  #label {
    position: absolute; top: 20px; left: 20px;
    color: #ffd9a0; font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 13px; letter-spacing: 1px; opacity: 0.55;
    z-index: 10; pointer-events: none;
  }
  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #ffb347; font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 14px; z-index: 20; opacity: 0.8;
  }
  canvas { display: block; }
</style>
</head>
<body>

<div id="sun-container">
  <div id="label">🌞 Drag to rotate • Scroll to zoom</div>
  <div id="loading">Loading solar texture...</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ================================================================
// SCENE SETUP
// ================================================================
const container = document.getElementById('sun-container');
const loadingLabel = document.getElementById('loading');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 2000
);
camera.position.z = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 1);
container.appendChild(renderer.domElement);

// ================================================================
// STARFIELD — multiple layers, twinkle animation
// ================================================================
// Real stars alag alag colors ke hote hain (star's temperature ke hisaab se):
// blue-white (hot), white, yellow, orange, red (cool) — random weighted pick
function pickStarColor() {
  const r = Math.random();
  if (r < 0.15) return new THREE.Color(0x9fc5ff); // blue-white (hot star)
  if (r < 0.45) return new THREE.Color(0xffffff); // white
  if (r < 0.70) return new THREE.Color(0xfff4d6); // warm white/yellow
  if (r < 0.88) return new THREE.Color(0xffd9a0); // orange-ish
  return new THREE.Color(0xffb0a0);                // reddish (cool star)
}

function createStarLayer(count, spread, size, opacity) {
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const radius = spread * (0.5 + Math.random() * 0.5);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos((Math.random() * 2) - 1);
    positions[i * 3]     = radius * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = radius * Math.cos(phi);

    const c = pickStarColor();
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const material = new THREE.PointsMaterial({
    size, transparent: true, opacity,
    sizeAttenuation: true, depthWrite: false,
    vertexColors: true
  });
  return new THREE.Points(geometry, material);
}

const starsFar  = createStarLayer(2500, 400, 0.7, 0.6);
const starsMid  = createStarLayer(1200, 250, 1.1, 0.8);
const starsNear = createStarLayer(400, 150, 1.8, 1.0);
scene.add(starsFar, starsMid, starsNear);

// ================================================================
// MILKY WAY HAZE — subtle diagonal band of soft light in the deep
// background, jaise real astro photos me galactic dust glow dikhta hai
// ================================================================
function createGalacticHaze() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 256);
  gradient.addColorStop(0,   'rgba(80,90,140,0)');
  gradient.addColorStop(0.5, 'rgba(140,130,180,0.18)');
  gradient.addColorStop(1,   'rgba(80,90,140,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 1024, 256);
  for (let i = 0; i < 400; i++) {
    ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.03})`;
    ctx.beginPath();
    ctx.arc(Math.random()*1024, Math.random()*256, Math.random()*30+5, 0, Math.PI*2);
    ctx.fill();
  }
  const texture = new THREE.CanvasTexture(canvas);
  const geo = new THREE.SphereGeometry(300, 32, 32);
  const mat = new THREE.MeshBasicMaterial({
    map: texture, side: THREE.BackSide, transparent: true,
    opacity: 0.5, depthWrite: false, blending: THREE.AdditiveBlending
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.z = 0.6;
  mesh.rotation.x = 0.3;
  return mesh;
}
scene.add(createGalacticHaze());

// ================================================================
// REAL SUN TEXTURE — loaded from a public CDN (NASA-derived solar texture)
// Fallback: agar texture load fail ho jaye, procedural shader akela chalega
// ================================================================
const textureLoader = new THREE.TextureLoader();
textureLoader.crossOrigin = 'anonymous';

const sunTexture = textureLoader.load(
  'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/sunmap.jpg',
  () => { loadingLabel.style.display = 'none'; sunMaterial.uniforms.useTexture.value = 1.0; },
  undefined,
  () => { loadingLabel.textContent = 'Texture load failed — using procedural surface'; setTimeout(()=>loadingLabel.style.display='none', 2000); }
);
sunTexture.wrapS = THREE.RepeatWrapping;
sunTexture.wrapT = THREE.ClampToEdgeWrapping;

// ================================================================
// SUN CORE — real texture blended with procedural fractal noise for
// extra turbulence/detail + sunspots + limb darkening
// ================================================================
const sunGeometry = new THREE.SphereGeometry(1.6, 128, 128);

const sunMaterial = new THREE.ShaderMaterial({
  uniforms: {
    time: { value: 0.0 },
    map: { value: sunTexture },
    useTexture: { value: 0.0 }
  },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec2 vUv;
    void main() {
      vNormal = normal;
      vPosition = position;
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: `
    uniform float time;
    uniform sampler2D map;
    uniform float useTexture;
    varying vec3 vNormal;
    varying vec3 vPosition;
    varying vec2 vUv;

    float random(vec3 p) {
      return fract(sin(dot(p, vec3(12.9898,78.233,45.164))) * 43758.5453123);
    }
    float noise(vec3 p) {
      vec3 i = floor(p); vec3 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float n000 = random(i), n100 = random(i+vec3(1,0,0));
      float n010 = random(i+vec3(0,1,0)), n110 = random(i+vec3(1,1,0));
      float n001 = random(i+vec3(0,0,1)), n101 = random(i+vec3(1,0,1));
      float n011 = random(i+vec3(0,1,1)), n111 = random(i+vec3(1,1,1));
      return mix(mix(mix(n000,n100,f.x), mix(n010,n110,f.x), f.y),
                 mix(mix(n001,n101,f.x), mix(n011,n111,f.x), f.y), f.z);
    }
    float fbm(vec3 p) {
      float value = 0.0; float amp = 0.5;
      for (int i = 0; i < 5; i++) { value += amp * noise(p); p *= 2.0; amp *= 0.5; }
      return value;
    }

    void main() {
      vec3 p = normalize(vPosition) * 3.0;
      p.x += time * 0.06;
      p.y += time * 0.03;

      float turbulence = fbm(p + fbm(p * 2.0));
      float granules = fbm(p * 6.0 + time * 0.1);
      float combined = turbulence * 0.7 + granules * 0.3;
      float spotMask = smoothstep(0.15, 0.35, turbulence);

      vec3 colorCore = vec3(1.0, 0.95, 0.75);
      vec3 colorMid  = vec3(1.0, 0.55, 0.08);
      vec3 colorDeep = vec3(0.75, 0.18, 0.02);
      vec3 colorSpot = vec3(0.35, 0.06, 0.0);

      vec3 proceduralColor = mix(colorDeep, colorMid, combined);
      proceduralColor = mix(proceduralColor, colorCore, pow(combined, 4.0) * 1.5);
      proceduralColor = mix(colorSpot, proceduralColor, spotMask);

      // UV scroll thoda slow taaki texture bhi surface ke saath halka move kare
      vec2 scrolledUv = vUv + vec2(time * 0.01, 0.0);
      vec3 texColor = texture2D(map, scrolledUv).rgb;

      // Texture ko procedural turbulence se modulate karo — realistic detail + dynamic feel
      vec3 texBlend = texColor * (0.6 + combined * 0.7);
      texBlend = mix(texBlend, colorCore, pow(combined, 5.0) * 0.8);
      texBlend = mix(colorSpot * 1.3, texBlend, spotMask * 0.6 + 0.4);

      vec3 color = mix(proceduralColor, texBlend, useTexture);

      // Limb darkening (real solar physics: edges darker/redder)
      float facing = dot(normalize(vNormal), vec3(0.0, 0.0, 1.0));
      float limbDarken = pow(max(facing, 0.0), 0.45);
      color *= mix(0.55, 1.15, limbDarken);

      // Rim brightening for blend with corona glow
      float rim = pow(1.0 - abs(facing), 3.0);
      color += rim * vec3(1.0, 0.45, 0.1) * 0.6;

      gl_FragColor = vec4(color, 1.0);
    }
  `
});

const sun = new THREE.Mesh(sunGeometry, sunMaterial);
scene.add(sun);

// ================================================================
// MULTI-LAYER CORONA GLOW
// ================================================================
function makeGlowShell(scale, opacityMul, color) {
  const geo = new THREE.SphereGeometry(1.6, 64, 64);
  const mat = new THREE.ShaderMaterial({
    uniforms: { glowColor: { value: new THREE.Color(color) }, opacityMul: { value: opacityMul } },
    vertexShader: `
      varying vec3 vNormal;
      void main() {
        vNormal = normalize(normalMatrix * normal);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 glowColor; uniform float opacityMul;
      varying vec3 vNormal;
      void main() {
        float intensity = pow(0.7 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.0);
        gl_FragColor = vec4(glowColor, intensity * opacityMul);
      }
    `,
    side: THREE.BackSide, blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(scale, scale, scale);
  return mesh;
}

const glowInner = makeGlowShell(1.25, 1.0, 0xffb347);
const glowMid   = makeGlowShell(1.55, 0.6, 0xff7a1a);
const glowOuter = makeGlowShell(2.0, 0.35, 0xff4500);
scene.add(glowInner, glowMid, glowOuter);

// Lens-flare-like radial sprite
function createGlowSprite() {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(128,128,0,128,128,128);
  gradient.addColorStop(0, 'rgba(255,240,200,0.9)');
  gradient.addColorStop(0.25, 'rgba(255,170,60,0.5)');
  gradient.addColorStop(0.6, 'rgba(255,90,20,0.15)');
  gradient.addColorStop(1, 'rgba(255,60,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,256,256);
  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(6, 6, 1);
  return sprite;
}
scene.add(createGlowSprite());

// ================================================================
// SOLAR FLARES / PROMINENCES — curved glowing arcs jo surface se
// nikalte aur wapas jud jaate hain, jaise real solar prominences hote hain
// ================================================================
function createFlare(startAngle, elevationAngle, arcSize, color) {
  const points = [];
  const segments = 40;
  const baseRadius = 1.62;

  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    // Arc shape: surface se uthta hai, peak par jaata hai, wapas surface par aata hai
    const height = Math.sin(t * Math.PI) * arcSize;
    const angleOffset = (t - 0.5) * arcSize * 0.8;

    const theta = startAngle + angleOffset;
    const phi = elevationAngle;
    const r = baseRadius + height;

    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.cos(phi) + (t === 0 || t === 1 ? 0 : 0);
    const z = r * Math.sin(phi) * Math.sin(theta);
    points.push(new THREE.Vector3(x, y, z));
  }

  const curve = new THREE.CatmullRomCurve3(points);
  const tubeGeo = new THREE.TubeGeometry(curve, 40, 0.02, 8, false);
  const tubeMat = new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const mesh = new THREE.Mesh(tubeGeo, tubeMat);
  mesh.userData.baseOpacity = 0.85;
  mesh.userData.phase = Math.random() * Math.PI * 2;
  return mesh;
}

const flareGroup = new THREE.Group();
const flareColors = [0xffaa44, 0xff7733, 0xffcc66];
for (let i = 0; i < 6; i++) {
  const flare = createFlare(
    Math.random() * Math.PI * 2,
    Math.random() * Math.PI,
    0.35 + Math.random() * 0.5,
    flareColors[i % flareColors.length]
  );
  flareGroup.add(flare);
}
scene.add(flareGroup);

// ================================================================
// LIGHTING
// ================================================================
scene.add(new THREE.PointLight(0xffcc88, 2.5, 100));
scene.add(new THREE.AmbientLight(0x221100, 0.3));

// ================================================================
// MOUSE / TOUCH DRAG-TO-ROTATE + ZOOM
// ================================================================
let isDragging = false;
let previousMouse = { x: 0, y: 0 };
const rotationSpeed = { y: 0.0022 };

function rotateSunGroup(deltaX, deltaY) {
  [sun, glowInner, glowMid, glowOuter, flareGroup].forEach(obj => {
    obj.rotation.y += deltaX * 0.005;
    obj.rotation.x += deltaY * 0.005;
  });

  // ============================================================
  // PARALLAX — stars bhi halka move karte hain jab sun ghumate ho.
  // Paas wale (near) stars zyada move, door wale (far) kam move —
  // isse real depth/3D feel aata hai (jaise real space me camera pan)
  // ============================================================
  starsNear.rotation.y += deltaX * 0.0022;
  starsNear.rotation.x += deltaY * 0.0022;

  starsMid.rotation.y += deltaX * 0.0011;
  starsMid.rotation.x += deltaY * 0.0011;

  starsFar.rotation.y += deltaX * 0.0004;
  starsFar.rotation.x += deltaY * 0.0004;
}

renderer.domElement.addEventListener('mousedown', (e) => { isDragging = true; previousMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  rotateSunGroup(e.clientX - previousMouse.x, e.clientY - previousMouse.y);
  previousMouse = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener('touchstart', (e) => { isDragging = true; previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY }; });
window.addEventListener('touchend', () => { isDragging = false; });
window.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  rotateSunGroup(e.touches[0].clientX - previousMouse.x, e.touches[0].clientY - previousMouse.y);
  previousMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });

renderer.domElement.addEventListener('wheel', (e) => {
  camera.position.z += e.deltaY * 0.005;
  camera.position.z = Math.max(3, Math.min(20, camera.position.z));
});

// ================================================================
// ANIMATION LOOP
// ================================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();
  sunMaterial.uniforms.time.value = elapsed;

  if (!isDragging) rotateSunGroup(rotationSpeed.y * 60, 0);

  const pulse = 1.0 + Math.sin(elapsed * 1.4) * 0.02;
  glowInner.scale.set(1.25 * pulse, 1.25 * pulse, 1.25 * pulse);
  glowMid.scale.set(1.55 * pulse, 1.55 * pulse, 1.55 * pulse);

  starsNear.material.opacity = 0.85 + Math.sin(elapsed * 2.0) * 0.15;
  starsMid.material.opacity  = 0.7 + Math.sin(elapsed * 1.3 + 1.0) * 0.1;

  // Solar flares flicker + halka pulse — jaise real plasma prominences unstable hote hain
  flareGroup.children.forEach((flare) => {
    const flicker = 0.55 + Math.sin(elapsed * 2.5 + flare.userData.phase) * 0.25
                          + Math.sin(elapsed * 7.0 + flare.userData.phase) * 0.1;
    flare.material.opacity = Math.max(0.15, flicker);
  });

  // Cinematic ambient camera drift — jab drag nahi kar rahe, camera bahut halka
  // sa float karta hai, jaise documentary shot me subtle handheld/orbit motion hota hai
  if (!isDragging) {
    camera.position.x = Math.sin(elapsed * 0.08) * 0.4;
    camera.position.y = Math.sin(elapsed * 0.05) * 0.25;
    camera.lookAt(0, 0, 0);
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
