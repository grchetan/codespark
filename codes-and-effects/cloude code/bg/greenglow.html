<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Background</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      canvas#bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
    </style>
  </head>

  <body>
    <canvas id="bg"></canvas>

    <script>
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      const isDark = document.body.classList.contains('dark');
      const bg = isDark ? '#0a0a0a' : '#eef0e8';

      const orbs = [
        { x: canvas.width * 0.85, y: canvas.height * 0.2, r: 200 },
        { x: canvas.width * 0.1, y: canvas.height * 0.8, r: 160 },
        { x: canvas.width * 0.5, y: canvas.height * 1.1, r: 180 },
      ];

      let t = 0;

      function draw() {
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        orbs.forEach((o, i) => {
          const pulse = Math.sin(t + i * 1.2) * 20;

          const grad = ctx.createRadialGradient(
            o.x,
            o.y,
            0,
            o.x,
            o.y,
            o.r + pulse,
          );

          grad.addColorStop(
            0,
            isDark ? 'rgba(76,175,34,0.18)' : 'rgba(76,175,34,0.12)',
          );
          grad.addColorStop(1, 'rgba(76,175,34,0)');

          ctx.beginPath();
          ctx.arc(o.x, o.y, o.r + pulse, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.fill();
        });

        t += 0.008;
        requestAnimationFrame(draw);
      }

      draw();
    </script>
  </body>
</html>
