<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora Wave</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        overflow: hidden;
        background: #0a0a1a;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <canvas id="bg"></canvas>

    <script>
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      resize();
      window.addEventListener('resize', resize);

      let t = 0;

      function draw() {
        ctx.fillStyle = '#0a0a1a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 5; i++) {
          ctx.beginPath();

          const hue = 180 + i * 30;
          ctx.strokeStyle = `hsla(${hue}, 80%, 60%, 0.4)`;
          ctx.lineWidth = 60;
          ctx.filter = 'blur(20px)';

          ctx.moveTo(0, canvas.height / 2);

          for (let x = 0; x <= canvas.width; x += 10) {
            const y =
              canvas.height / 2 +
              Math.sin(x / 200 + t + i) * 60 +
              Math.sin(x / 100 + t * 1.5 + i) * 30;

            ctx.lineTo(x, y);
          }

          ctx.stroke();
        }

        ctx.filter = 'none';
        t += 0.008;

        requestAnimationFrame(draw);
      }

      draw();
    </script>
  </body>
</html>
