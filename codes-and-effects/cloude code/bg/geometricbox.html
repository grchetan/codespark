<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometric Grid</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
        overflow: hidden;
        background: #111827;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body>
    <canvas id="bg"></canvas>

    <script>
      const canvas = document.getElementById('bg');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }

      resize();
      window.addEventListener('resize', resize);

      let t = 0;

      function draw() {
        ctx.fillStyle = '#111827';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const size = 40;

        for (let x = 0; x < canvas.width; x += size) {
          for (let y = 0; y < canvas.height; y += size) {
            const d = Math.hypot(x - canvas.width / 2, y - canvas.height / 2);

            const wave = Math.sin(d / 80 - t) * 0.5 + 0.5;

            // Border square
            ctx.strokeStyle = `rgba(99,102,241,${wave * 0.6})`;
            ctx.lineWidth = 0.5;
            ctx.strokeRect(
              x + size * 0.1,
              y + size * 0.1,
              size * 0.8,
              size * 0.8,
            );

            // Inner square glow
            if (wave > 0.7) {
              ctx.fillStyle = `rgba(99,102,241,${(wave - 0.7) * 0.5})`;
              ctx.fillRect(
                x + size * 0.3,
                y + size * 0.3,
                size * 0.4,
                size * 0.4,
              );
            }
          }
        }

        t += 0.03;
        requestAnimationFrame(draw);
      }

      draw();
    </script>
  </body>
</html>
