<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blurry Blob</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f0f0f0; /* For visibility */
      }

      #blurry-blob {
        min-height: 13rem; /* min-h-52 */
        min-width: 13rem; /* min-w-52 */
        display: flex;
        align-items: center; /* items-center */
        justify-content: center; /* justify-center */
      }

      .blob-container {
        position: relative;
        width: 100%; /* w-full */
        max-width: 32rem; /* max-w-lg */
      }

      .blob {
        position: absolute;
        height: 18rem; /* h-72 */
        width: 18rem; /* w-72 */
        padding: 2rem; /* p-8 */
        opacity: 0.45; /* opacity-45 */
        mix-blend-mode: multiply; /* mix-blend-multiply */
        filter: blur(96px); /* blur-3xl (approximated) */
        border-radius: 0.125rem; /* rounded-sm */
        animation: pop-blob 5s ease-in-out infinite; /* animate-pop-blob */
      }

      .blob-first {
        right: -6rem; /* -right-24 */
        top: -7rem; /* -top-28 */
        background-color: #3b82f6; /* bg-blue-400 */
      }

      .blob-second {
        left: -10rem; /* -left-40 */
        top: -16rem; /* -top-64 */
        background-color: #a78bfa; /* bg-purple-400 */
      }

      @keyframes pop-blob {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div id="blurry-blob">
      <div class="blob-container">
        <div class="blob blob-first"></div>
        <div class="blob blob-second"></div>
      </div>
    </div>
    <script>
      const config = {
        firstBlobColor: "#3b82f6", // bg-blue-400
        secondBlobColor: "#a78bfa", // bg-purple-400
      };

      function init() {
        const firstBlob = document.querySelector(".blob-first");
        const secondBlob = document.querySelector(".blob-second");

        if (firstBlob && secondBlob) {
          firstBlob.style.backgroundColor = config.firstBlobColor;
          secondBlob.style.backgroundColor = config.secondBlobColor;
        }
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
