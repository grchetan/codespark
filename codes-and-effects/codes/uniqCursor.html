<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursor FX</title>
    <style>
      body {
        min-height: 100vh;
        overflow: hidden;
        cursor: none;
      }
      .hint {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, 0.06);
        font-family: 'Courier New', monospace;
        font-size: clamp(1.5rem, 4vw, 3rem);
        font-weight: 900;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        pointer-events: none;
        user-select: none;
      }
      canvas {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 50;
      }
      /* Custom cursor */
      #cur {
        position: fixed;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: white;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 200;
        mix-blend-mode: exclusion;
      }
    </style>
  </head>
  <body>
    <div class="hint">Move Your Cursor</div>
    <div id="cur"></div>
    <canvas id="c"></canvas>

    <script>
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const cur = document.getElementById('cur');

      let W = (canvas.width = window.innerWidth);
      let H = (canvas.height = window.innerHeight);
      window.addEventListener('resize', () => {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      });

      // Mouse
      const mouse = { x: W / 2, y: H / 2 };
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        cur.style.left = e.clientX + 'px';
        cur.style.top = e.clientY + 'px';
      });
      window.addEventListener(
        'touchmove',
        (e) => {
          mouse.x = e.touches[0].clientX;
          mouse.y = e.touches[0].clientY;
        },
        { passive: true },
      );

      // ── Dot trail (lightweight) ───────────────────────────────────
      const DOTS = 18;
      const trail = Array.from({ length: DOTS }, () => ({
        x: mouse.x,
        y: mouse.y,
      }));

      // ── Particles (max 40 alive at once) ─────────────────────────
      const MAX_P = 40;
      const particles = [];
      let hue = 0;
      let frameCount = 0;

      class Dot {
        constructor(x, y) {
          this.x = x;
          this.y = y;
          const a = Math.random() * Math.PI * 2;
          const s = 0.8 + Math.random() * 1.8;
          this.vx = Math.cos(a) * s;
          this.vy = Math.sin(a) * s - 0.5;
          this.life = 1;
          this.decay = 0.028 + Math.random() * 0.02;
          this.r = 1.5 + Math.random() * 2;
          this.hue = hue + Math.random() * 40 - 20;
        }
        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.04;
          this.vx *= 0.98;
          this.life -= this.decay;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.r * this.life, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue},100%,70%,${this.life * 0.8})`;
          ctx.fill();
        }
      }

      // Click burst — only 12 particles
      window.addEventListener('mousedown', (e) => {
        for (let i = 0; i < 12; i++)
          particles.push(new Dot(e.clientX, e.clientY));
      });

      // ── Render ────────────────────────────────────────────────────
      function render() {
        requestAnimationFrame(render);
        frameCount++;
        hue = (hue + 0.8) % 360;

        // Fade
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(6,6,16,0.25)';
        ctx.fillRect(0, 0, W, H);

        // Update trail
        trail[0].x += (mouse.x - trail[0].x) * 0.5;
        trail[0].y += (mouse.y - trail[0].y) * 0.5;
        for (let i = 1; i < DOTS; i++) {
          trail[i].x += (trail[i - 1].x - trail[i].x) * 0.45;
          trail[i].y += (trail[i - 1].y - trail[i].y) * 0.45;
        }

        // Draw trail as glowing ribbon
        ctx.globalCompositeOperation = 'lighter';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        for (let i = 1; i < DOTS; i++) {
          const t = 1 - i / DOTS;
          const h = (hue + i * 8) % 360;
          ctx.beginPath();
          ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
          ctx.lineTo(trail[i].x, trail[i].y);
          ctx.strokeStyle = `hsla(${h},100%,65%,${t * 0.6})`;
          ctx.lineWidth = t * 5;
          ctx.shadowColor = `hsla(${h},100%,70%,0.5)`;
          ctx.shadowBlur = 6;
          ctx.stroke();
        }

        // Emit 1-2 particles per frame (only when moving)
        const dx = trail[0].x - trail[1].x;
        const dy = trail[0].y - trail[1].y;
        const speed = Math.sqrt(dx * dx + dy * dy);
        if (speed > 2 && particles.length < MAX_P && frameCount % 2 === 0) {
          particles.push(new Dot(mouse.x, mouse.y));
        }

        // Draw particles
        ctx.shadowBlur = 0;
        ctx.globalCompositeOperation = 'lighter';
        for (let i = particles.length - 1; i >= 0; i--) {
          particles[i].update();
          particles[i].draw();
          if (particles[i].life <= 0) particles.splice(i, 1);
        }

        ctx.shadowBlur = 0;
      }

      render();
    </script>
  </body>
</html>
