<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kotak Scroll Effect</title>
    <style>
      /* Itni height rakho taaki scroll karne ki jagah mile */
      .sticky-section {
        position: relative;
        height: 400vh;
      }

      /* Yeh screen par chipka rehta hai */
      .sticky-inner {
        position: sticky;
        top: 0;
        height: 100vh;
        background: #1b3a4b;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden; /* zaruri hai — cards neeche se aate hain */
      }

      .heading {
        color: #fff;
        font-size: 36px;
        font-weight: 600;
        text-align: center;
        margin-bottom: 48px;
      }

      /* Cards side by side */
      .cards-area {
        display: flex;
        gap: 24px;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: #dde3e8;
        border-radius: 18px;
        padding: 32px 28px;
        width: 280px;
        min-height: 230px;
        will-change: transform; /* performance ke liye */
      }

      .card-icon {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: #2a4a5e;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin-bottom: 20px;
      }

      .card-title {
        font-size: 18px;
        font-weight: 600;
        color: #1a2e3a;
        margin-bottom: 8px;
      }
      .card-desc {
        font-size: 14px;
        color: #4a6070;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="sticky-section" id="stickySection">
      <div class="sticky-inner">
        <h2 class="heading">Choosing Kotak811 for Personal Loan</h2>

        <div class="cards-area">
          <div class="card" id="card1">
            <div class="card-icon">%</div>
            <div class="card-title">Attractive Interest Rates</div>
            <div class="card-desc">
              Interest rates starting at just 10.99% Interest* p.a.
            </div>
          </div>

          <div class="card" id="card2">
            <div class="card-icon">📋</div>
            <div class="card-title">Minimal Documentation</div>
            <div class="card-desc">
              Fast and digital loan verification process
            </div>
          </div>

          <div class="card" id="card3">
            <div class="card-icon">🏦</div>
            <div class="card-title">Zero Collateral</div>
            <div class="card-desc">
              No need to mortgage property to secure a loan with us
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Baad ki content -->
    <section style="padding: 80px; text-align: center; background: #fff">
      <h2>Yahan agle section ki content</h2>
    </section>

    <script>
      const section = document.getElementById('stickySection');
      const card1 = document.getElementById('card1');
      const card2 = document.getElementById('card2');
      const card3 = document.getElementById('card3');

      function updateCards() {
        const rect = section.getBoundingClientRect();
        const scrolled = -rect.top;
        const total = section.offsetHeight - window.innerHeight;

        // Progress 0 (start) se 1 (end) tak
        const p = Math.min(Math.max(scrolled / total, 0), 1);

        // ====================================
        // Har card ka alag phase hota hai
        // Card 1: scroll 0%  → 25%  par aata hai
        // Card 2: scroll 28% → 55%  par aata hai
        // Card 3: scroll 57% → 84%  par aata hai
        // ====================================
        const p1 = Math.min(Math.max((p - 0.0) / 0.25, 0), 1);
        const p2 = Math.min(Math.max((p - 0.28) / 0.27, 0), 1);
        const p3 = Math.min(Math.max((p - 0.57) / 0.27, 0), 1);

        const startY = 650; // kitne pixels neeche se shuru ho

        // translateY directly scroll se linked — isliye ruk jaata hai jab scroll ruko
        card1.style.transform = `translateY(${startY * (1 - p1)}px)`;
        card2.style.transform = `translateY(${startY * (1 - p2)}px)`;
        card3.style.transform = `translateY(${startY * (1 - p3)}px)`;
      }

      window.addEventListener('scroll', updateCards, { passive: true });
      updateCards(); // page load par bhi call karo
    </script>
  </body>
</html>
