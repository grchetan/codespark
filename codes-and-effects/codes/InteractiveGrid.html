<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Grid (CSS Only)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .interactive-grid {
        background-image: linear-gradient(
            123deg,
            transparent 0%,
            transparent 36%,
            rgba(17, 17, 57, 0.02) 36%,
            rgba(17, 17, 87, 0.02) 56%,
            transparent 56%,
            transparent 100%
          ),
          linear-gradient(
            251deg,
            transparent 0%,
            transparent 68%,
            rgba(3, 3, 3, 0.02) 68%,
            rgba(3, 3, 93, 0.02) 99%,
            transparent 99%,
            transparent 100%
          ),
          linear-gradient(135deg, rgb(200, 215, 255), rgb(205, 215, 255));
      }

      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(24px, 1fr));
        grid-auto-rows: 24px;
        gap: 24px;
        padding: 48px; /* boundary = size * 2 */
      }

      .square {
        position: absolute;
        height: 1.5rem; /* h-6 (24px) */
        width: 1.5rem; /* w-6 */
        border-radius: 0.375rem; /* rounded-md */
        background: transparent;
        padding: 1px; /* p-px */
        border: 1px solid rgba(156, 163, 175, 0.3); /* border-gray-400/30 */
        box-sizing: border-box;
      }

      .square-inner {
        height: 100%;
        width: 100%;
        transform: scale(0.9);
        border-radius: 0.25rem; /* rounded */
        background: rgba(156, 163, 175, 0.3); /* bg-gray-400/30 */
        opacity: 0;
        transition: all 700ms;
      }

      .square:hover .square-inner {
        transform: scale(1);
        opacity: 1;
        animation: highlight-cycle 5s linear infinite;
      }

      @keyframes highlight-cycle {
        0%,
        20%,
        40%,
        60%,
        80% {
          transform: scale(1);
          opacity: 1;
        }
        10%,
        30%,
        50%,
        70%,
        90% {
          transform: scale(0.95);
          opacity: 0.8;
        }
      }

      @media (min-height: 384px) {
        .grid-container {
          top: 25%; /* top-1/4 */
        }
      }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div
      class="interactive-grid storybook-fix relative h-full w-full overflow-hidden rounded-3xl"
    >
      <div
        class="grid-container absolute inset-0 h-full max-h-96 w-full top-1/4"
      >
        <!-- Static grid squares (approximated) -->
        <div class="square" style="transform: translate(48px, 48px)">
          <div class="square-inner"></div>
        </div>
        <div class="square" style="transform: translate(72px, 48px)">
          <div class="square-inner"></div>
        </div>
        <div class="square" style="transform: translate(48px, 72px)">
          <div class="square-inner"></div>
        </div>
        <div class="square" style="transform: translate(72px, 72px)">
          <div class="square-inner"></div>
        </div>
        <div class="square" style="transform: translate(96px, 48px)">
          <div class="square-inner"></div>
        </div>
        <div class="square" style="transform: translate(96px, 72px)">
          <div class="square-inner"></div>
        </div>
        <!-- Add more squares as needed for your grid size -->
      </div>
      <div class="relative mx-auto h-full w-fit">
        <h1 class="text-white text-2xl">Sample Content</h1>
        <p class="text-white">This is a placeholder for your content.</p>
      </div>
    </div>
  </body>
</html>
